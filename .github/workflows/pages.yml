name: Publish GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kantemirovskaya-v1/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run test:production
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Build the separate 3D game
        run: |
          npm --prefix kantemirovskaya-v1 test
          npm --prefix kantemirovskaya-v1 run build
          mkdir -p dist/3d
          cp -R kantemirovskaya-v1/dist/. dist/3d/
          touch dist/.nojekyll
      - uses: actions/upload-artifact@v4
        with:
          name: kantemirovskaya-3d-production
          path: kantemirovskaya-v1/dist
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify the published site and local 3D assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: python
        run: |
          import os,time,urllib.request,json
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          paths=['','3d/','3d/src/app.js','3d/src/map-data.js','3d/vendor/three.module.min.js','3d/assets/head-center.webp']
          verified=[]
          for path in paths:
            for attempt in range(8):
              try:
                request=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache'})
                with urllib.request.urlopen(request,timeout=30) as response:
                  data=response.read()
                  assert response.status==200
                if path=='3d/': assert 'Кантемировская 3D' in data.decode('utf-8')
                verified.append({'url':base+path,'status':200,'bytes':len(data)})
                break
              except Exception:
                if attempt==7: raise
                time.sleep(8)
          print(json.dumps({'verified_public_3d_url':base+'3d/','checks':verified},ensure_ascii=False,indent=2))
