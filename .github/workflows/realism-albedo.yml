name: Realism diffuse maps
on:
  push:
    branches: [visual-upgrade-v1-1]
    paths: ['.github/workflows/realism-albedo.yml']
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retrieve CC0 maps
        shell: python
        run: |
          from pathlib import Path
          import urllib.request,json
          out=Path('output');out.mkdir()
          records=[]
          for label,asset in [('asphalt','asphalt_02'),('grass','aerial_grass_rock'),('plaster','plastered_wall_04'),('bark','bark_brown_02')]:
            req=urllib.request.Request('https://api.polyhaven.com/files/'+asset,headers={'User-Agent':'KantemirovskayaGame/1.1'})
            info=json.load(urllib.request.urlopen(req,timeout=20))
            (out/(asset+'.json')).write_text(json.dumps(info,indent=2))
            candidates=[]
            for key,versions in info.items():
              if not isinstance(versions,dict):continue
              for fmt,entry in versions.get('1k',{}).items():
                if isinstance(entry,dict) and fmt in ['jpg','png'] and ('diff' in entry.get('url','').lower() or 'color' in key.lower()):
                  candidates.append((0 if fmt=='jpg' else 1,fmt,entry))
            if candidates:
              _,fmt,entry=sorted(candidates,key=lambda x:x[0])[0]
              data=urllib.request.urlopen(entry['url'],timeout=20).read()
              name=label+'-color.'+fmt;(out/name).write_bytes(data)
              records.append({'file':name,'url':entry['url'],'license':'CC0-1.0'})
          (out/'sources.json').write_text(json.dumps(records,indent=2));print(records)
      - uses: actions/upload-artifact@v4
        with:
          name: realism-diffuse
          path: output
          retention-days: 7
