name: Freeze visual assets
on:
  push:
    branches: [visual-upgrade-v1-1]
    paths: ['.github/workflows/realism-freeze.yml']
permissions:
  contents: write
  actions: read
jobs:
  assets:
    if: github.ref == 'refs/heads/visual-upgrade-v1-1'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual-upgrade-v1-1
      - uses: actions/download-artifact@v4
        with:
          name: realism-materials
          run-id: 33941389212
          github-token: ${{ github.token }}
          path: /tmp/realism-resources
      - uses: actions/download-artifact@v4
        with:
          name: realism-diffuse
          run-id: 33941507437
          github-token: ${{ github.token }}
          path: /tmp/realism-diffuse
      - run: python -m pip install pillow numpy
      - name: Prepare redistributable runtime files
        run: python kantemirovskaya-v1/scripts/prepare-realism.py --resources /tmp/realism-resources --diffuse /tmp/realism-diffuse
      - name: Commit only generated 3D assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kantemirovskaya-v1/public/assets/pbr kantemirovskaya-v1/public/assets/models kantemirovskaya-v1/public/assets/face-*.webp kantemirovskaya-v1/vendor/addons kantemirovskaya-v1/licenses
          git diff --cached --quiet || git commit -m 'Freeze CC0 visual materials and clothed articulated mesh'
          git pull --rebase origin visual-upgrade-v1-1
          git push origin HEAD:visual-upgrade-v1-1
